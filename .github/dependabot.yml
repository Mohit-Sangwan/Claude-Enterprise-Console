version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      otel:
        patterns: ["OpenTelemetry*"]
      ef:
        patterns: ["Microsoft.EntityFrameworkCore*"]
      aspnet:
        patterns: ["Microsoft.AspNetCore*", "Microsoft.Extensions.*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
